// ===== DOM ELEMENTS =====
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const loader = document.getElementById('loader');
const resultsContainer = document.getElementById('resultsContainer');
const resultsGrid = document.getElementById('resultsGrid');
const resultCount = document.getElementById('resultCount');
const emptyState = document.getElementById('emptyState');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxDownload = document.getElementById('lightboxDownload');
const toast = document.getElementById('toast');

// ===== FUNCTIONS =====
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function openLightbox(url) {
    lightboxImg.src = url;
    lightboxDownload.href = url;
    lightboxDownload.setAttribute('download', 'tiktok_photo.jpg');
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { lightboxImg.src = ''; }, 300);
}

// Gallery navigation
galleryStates = {};

function initGallery(cardId, totalImages) {
    galleryStates[cardId] = { current: 0, total: totalImages };
}

function goToSlide(cardId, index) {
    const state = galleryStates[cardId];
    if (!state || index < 0 || index >= state.total) return;
    state.current = index;
    const track = document.getElementById(`track-${cardId}`);
    const dots = document.querySelectorAll(`[data-dot="${cardId}"]`);
    if (track) track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
    const counter = document.getElementById(`counter-${cardId}`);
    if (counter) counter.textContent = `${index + 1}/${state.total}`;
}

function nextSlide(cardId) {
    const state = galleryStates[cardId];
    if (state) goToSlide(cardId, (state.current + 1) % state.total);
}

function prevSlide(cardId) {
    const state = galleryStates[cardId];
    if (state) goToSlide(cardId, (state.current - 1 + state.total) % state.total);
}

function renderResults(data) {
    resultsGrid.innerHTML = '';
    if (!data.result || data.result.length === 0) {
        emptyState.classList.add('active');
        resultsContainer.style.display = 'none';
        return;
    }
    emptyState.classList.remove('active');
    resultsContainer.style.display = 'block';
    resultCount.textContent = data.result.length;
    data.result.forEach((item, idx) => {
        const images = item.images || [];
        const stats = item.stats || {};
        const author = item.author || {};
        const music = item.music_info || {};
        const cardId = `card-${idx}`;
        const totalImgs = images.length;
        const dotsHtml = images.map((_, i) => `<div class="gallery-dot ${i===0?'active':''}" data-dot="${cardId}" onclick="goToSlide('${cardId}', ${i})"></div>`).join('');
        const imgsHtml = images.map(url => `<img class="gallery-image" src="${url}" alt="TikTok Photo" onclick="openLightbox('${url}')" loading="lazy">`).join('');
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.style.animationDelay = `${idx * 0.08}s`;
        card.innerHTML = `
            <div class="image-gallery" id="gallery-${cardId}">
                <div class="gallery-track" id="track-${cardId}">${imgsHtml}</div>
                <div class="image-counter" id="counter-${cardId}">1/${totalImgs}</div>
                ${totalImgs > 1 ? `<button class="nav-arrow prev" onclick="prevSlide('${cardId}')"><i class="fas fa-chevron-left"></i></button><button class="nav-arrow next" onclick="nextSlide('${cardId}')"><i class="fas fa-chevron-right"></i></button><div class="gallery-nav">${dotsHtml}</div>` : ''}
            </div>
            <div class="card-content">
                <div class="author-row">
                    <img class="author-avatar" src="${author.avatar || ''}" alt="avatar" loading="lazy" onerror="this.src='https://via.placeholder.com/42'">
                    <div class="author-info">
                        <div class="author-name">${author.fullname || 'Unknown'}</div>
                        <div class="author-handle">@${author.nickname || 'unknown'}</div>
                    </div>
                    <div class="region-badge">${item.region || 'ID'}</div>
                </div>
                <div class="caption">${item.title || ''}</div>
                <div class="stats-grid">
                    <div class="stat-box views"><div class="stat-icon"><i class="fas fa-eye"></i></div><div class="stat-value">${stats.views || '0'}</div><div class="stat-label">Views</div></div>
                    <div class="stat-box likes"><div class="stat-icon"><i class="fas fa-heart"></i></div><div class="stat-value">${stats.likes || '0'}</div><div class="stat-label">Likes</div></div>
                    <div class="stat-box comments"><div class="stat-icon"><i class="fas fa-comment"></i></div><div class="stat-value">${stats.comment || '0'}</div><div class="stat-label">Comments</div></div>
                    <div class="stat-box shares"><div class="stat-icon"><i class="fas fa-share"></i></div><div class="stat-value">${stats.share || '0'}</div><div class="stat-label">Shares</div></div>
                </div>
                <div class="music-bar">
                    <div class="music-icon"><i class="fas fa-music"></i></div>
                    <div class="music-details">
                        <div class="music-title">${music.title || 'Unknown'}</div>
                        <div class="music-artist">${music.author || 'Unknown'}</div>
                    </div>
                    <div class="music-duration">${music.duration || ''}</div>
                </div>
                <div class="action-row">
                    <a href="${images[0] || '#'})" target="_blank" class="action-btn btn-primary" download="tiktok_photo.jpg"><i class="fas fa-download"></i> Download</a>
                    <button class="action-btn btn-secondary" onclick="copyLink('${images[0] || ''}')"><i class="fas fa-link"></i> Copy Link</button>
                </div>
            </div>
        `;
        resultsGrid.appendChild(card);
        initGallery(cardId, totalImgs);
    });
}

function copyLink(url) {
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => showToast('Link berhasil disalin! ✅')).catch(() => showToast('Gagal menyalin link'));
}

async function doSearch(query) {
    if (!query.trim()) { showToast('Masukkan kata kunci pencarian!'); return; }
    loader.style.display = 'block';
    resultsContainer.style.display = 'none';
    emptyState.classList.remove('active');
    searchBtn.disabled = true;
    searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
        // Coba fetch dari API
        const response = await fetch(`https://api.nexray.eu.cc/search/tiktokphoto?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (data.status && data.result && data.result.length > 0) {
            renderResults(data);
            showToast(`Ditemukan ${data.result.length} hasil! ✅`);
        } else {
            // Fallback ke dummy data untuk demo
            renderResults(dummyData);
            showToast('Menampilkan data demo (API limit)');
        }
    } catch (err) {
        console.error(err);
        renderResults(dummyData);
        showToast('Menampilkan data demo (API error)');
    } finally {
        loader.style.display = 'none';
        searchBtn.disabled = false;
        searchBtn.innerHTML = '<i class="fas fa-arrow-right"></i>';
    }
}

// ===== EVENT LISTENERS =====
searchBtn.addEventListener('click', () => doSearch(searchInput.value));
searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(searchInput.value); });
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

// Load demo on start
window.addEventListener('DOMContentLoaded', () => {
    searchInput.value = 'cewek';
    doSearch('cewek');
});
</script>
</body>
</html>
